 ['login','home','new'].forEach(k=>{const el=document.getElementById('s-'+k); if(el){el.classList.add('hidden');el.classList.remove('flex')}});

 if(s==='new'){document.getElementById('f-num').value=genNum();document.getElementById('f-date').value=new Date().toLocaleString('pt-BR');}
 if(s==='home')renderHome();
}

function initSigs(){
 initSigBackground();
 ['sig-armazem','sig-mot'].forEach(id=>{
  const c=document.getElementById(id); if(!c)return;
  const ctx=c.getContext('2d');ctx.lineWidth=2;ctx.strokeStyle='#000'; let d=false;
  function pos(e){const rect=c.getBoundingClientRect();const x=(e.touches?e.touches[0].clientX:e.clientX)-rect.left;const y=(e.touches?e.touches[0].clientY:e.clientY)-rect.top;return {x:x*(c.width/rect.width), y:y*(c.height/rect.height)}}
  c.addEventListener('mousedown',e=>{d=true;const p=pos(e);ctx.beginPath();ctx.moveTo(p.x,p.y)});
  c.addEventListener('mousemove',e=>{if(!d)return;const p=pos(e);ctx.lineTo(p.x,p.y);ctx.stroke()});
  c.addEventListener('mouseup',()=>d=false); c.addEventListener('mouseleave',()=>d=false);
  c.addEventListener('touchstart',e=>{d=true;const p=pos(e);ctx.beginPath();ctx.moveTo(p.x,p.y);e.preventDefault()},{passive:false});
  c.addEventListener('touchmove',e=>{if(!d)return;const p=pos(e);ctx.lineTo(p.x,p.y);ctx.stroke();e.preventDefault()},{passive:false});
  c.addEventListener('touchend',()=>d=false);
 });
}

function corrigirFotoDeitada(base64, cb){
 const img=new Image();
 img.onload=function(){
  const canvas=document.createElement('canvas'); const ctx=canvas.getContext('2d');
  let w=img.width,h=img.height;
  if(w>h){canvas.width=h;canvas.height=w;ctx.translate(h/2,w/2);ctx.rotate(90*Math.PI/180);ctx.drawImage(img,-w/2,-h/2);}
  else{canvas.width=w;canvas.height=h;ctx.drawImage(img,0,0);}
  cb(canvas.toDataURL('image/jpeg',0.7));
 };
 img.onerror=function(){cb(base64)}; img.src=base64;
}

 Array.from(files).forEach(file=>{
  const reader=new FileReader();
  reader.onload=function(ev){
   corrigirFotoDeitada(ev.target.result, function(corrigida){

 });

function enviarNFParaFinanceiro(){
 const cur=criarCurDoForm(); if(!cur)return;
 if(!cur.fotosNF || cur.fotosNF.length===0){alert('Tire pelo menos 1 foto da NF!');return;}
 try{
  const jsPDF=window.jspdf.jsPDF; const docFotos=new jsPDF();
  docFotos.setFillColor(0,40,180);docFotos.rect(0,0,210,20,'F');
  docFotos.setTextColor(255,255,255);docFotos.setFontSize(12);docFotos.text('NF PARA FINANCEIRO - '+cur.nf+'',105,13,{align:'center'});
  docFotos.setTextColor(0,0,0);docFotos.setFontSize(9); let y=28;

  docFotos.text('Contato: '+(cur.contato||'-')+' | Telefone: '+(cur.telefone||'-'),15,y);y+=6;
  docFotos.text('NFe: '+cur.nf+' | Recibo: '+cur.num+' | Produtos: '+(cur.cnpj||'-').substring(0,40),15,y);y+=8;
  cur.fotosNF.forEach((s,idx)=>{
    if(y>120){docFotos.addPage();y=15;}
    try{
      docFotos.setFontSize(8);
      docFotos.text('Foto '+(idx+1)+' - NFe '+cur.nf,15,y);y+=4;
      const imgProps = docFotos.getImageProperties(s);
      let w=100, h=130;
      if(imgProps.width > imgProps.height){
        w=130; h=100;
        docFotos.addImage(s,'JPEG',40,y,w,h,undefined,'FAST',270);
      } else {
        docFotos.addImage(s,'JPEG',55,y,w,h);
      }
      y+=135;
    }catch(e){
      try{
        const imgProps = docFotos.getImageProperties(s);
        if(imgProps.width > imgProps.height){
          docFotos.addImage(s,'PNG',40,y,130,100,undefined,'FAST',270);
        } else {
          docFotos.addImage(s,'PNG',55,y,100,130);
        }
        y+=135;
      }catch(e2){}
    }
  });
  const fnFotos='NF-FINANCEIRO-'+cur.nf+'-'+cur.num+'.pdf';
  const fileFotos=new File([docFotos.output('blob')], fnFotos, {type:'application/pdf'});
  try{recibos.push({num:cur.num, date:cur.date, cliente:cur.cliente, nf:cur.nf, mot:cur.mot, placa:cur.placa}); saveRecibos();}catch(e){}
  if(navigator.canShare && navigator.canShare({files:[fileFotos]})){
   navigator.share({files:[fileFotos], title:'NF Financeiro '+cur.nf, text:'NF para Financeiro - Cliente:'+cur.cliente+' NFe:'+cur.nf}).then(()=>alert('✅ NF enviada para Financeiro!\\nVocê continua na mesma página para enviar a Guia.')).catch(()=>{docFotos.save(fnFotos);});
  }else{
   docFotos.save(fnFotos);
   setTimeout(()=>{const subj=encodeURIComponent('NF FINANCEIRO - '+cur.nf); const body=encodeURIComponent('Segue NF para Financeiro\\nCliente: '+cur.cliente+'\\nNFe: '+cur.nf); window.location.href='mailto:?subject='+subj+'&body='+body;},800);
  }
 }catch(err){alert('Erro NF: '+err.message);}
}
